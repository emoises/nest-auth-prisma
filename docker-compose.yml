version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_nest_auth
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nest_auth_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
